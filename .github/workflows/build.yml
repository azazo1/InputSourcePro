name: Release
on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (leave empty to build the selected ref)
        required: false
        type: string

permissions:
  contents: read

# Keep stable and beta runs separate so a branch push cannot cancel a stable release.
concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether to build
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "push" ]; then
            echo '::notice::Manual runs publish an artifact and no release.'
            echo 'build=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$DEVELOPER_ID_APPLICATION" ]; then
            echo '::notice::Signing credentials are absent; publishing is skipped.'
            echo 'build=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/release.py plan

  # Builds an ad-hoc signed app on every trigger, so a branch, tag, or manual run
  # always leaves a downloadable artifact behind. No signing credentials are needed.
  build:
    name: Build artifact
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}"
      - name: Validate tag input
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG"
          git rev-parse --verify "refs/tags/$TAG^{commit}" > /dev/null
      - name: Read version
        id: version
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG_INPUT" ]; then
            version="${TAG_INPUT#v}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            marketing=$(sed -n 's/.*MARKETING_VERSION = \([0-9.]*\);/\1/p' "Input Source Pro.xcodeproj/project.pbxproj" | head -1)
            test -n "$marketing"
            version="$marketing-${GITHUB_SHA:0:7}"
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
      - name: Test app
        run: >-
          xcodebuild -scheme "Input Source Pro" -configuration Debug
          -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/build-derived"
          CODE_SIGNING_ALLOWED=NO test
      - name: Build ad-hoc signed app
        run: >-
          xcodebuild -scheme "Input Source Pro" -configuration Release
          -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/dist-derived"
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES build
      - name: Package artifact
        id: package
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/dist-derived/Build/Products/Release/Input Source Pro.app"
          executable="$app/Contents/MacOS/Input Source Pro"
          test -d "$app"
          test -x "$executable"
          file "$executable" | grep 'Mach-O' > /dev/null
          # The embedded login item keeps a plist-derived signature that ad-hoc builds
          # do not refresh, which makes a recursive verification fail. Report the
          # signature instead of blocking the artifact on it.
          codesign --display "$executable" || true
          name="Input-Source-Pro-${{ steps.version.outputs.version }}-macos-${{ steps.version.outputs.arch }}"
          mkdir -p "$RUNNER_TEMP/artifact"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/artifact/$name.zip"
          ls -l "$RUNNER_TEMP/artifact"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ runner.temp }}/artifact/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    permissions:
      contents: write
    # The app needs Swift 6.4, included with Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Set release paths
        run: |
          printf 'RUN_SIGNING_DIR=%s/release-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare release
        id: release
        run: python3 scripts/release.py prepare
      - name: Set up Node.js for DMG packaging
        if: steps.release.outputs.complete != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test release scripts
        if: steps.release.outputs.complete != 'true'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test app
        if: steps.release.outputs.complete != 'true'
        run: >-
          xcodebuild -scheme "Input Source Pro" -configuration Debug
          -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/release-derived-${GITHUB_RUN_ID}"
          CODE_SIGNING_ALLOWED=NO test
      - name: Install signing credentials
        if: steps.release.outputs.complete != 'true'
        env:
          EXPORT_OPTIONS_PLIST_B64: ${{ secrets.EXPORT_OPTIONS_PLIST_B64 }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_APPLICATION_PSW: ${{ secrets.DEVELOPER_ID_APPLICATION_PSW }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUN_SIGNING_DIR"
          security list-keychains -d user > "$RUN_SIGNING_DIR/keychains.txt"
          printf '%s' "$EXPORT_OPTIONS_PLIST_B64" | base64 --decode > "$RUN_SIGNING_DIR/ExportOptions.plist"
          printf '%s' "$DEVELOPER_ID_APPLICATION" | base64 --decode > "$RUN_SIGNING_DIR/distribution.p12"
          keychain="$RUN_SIGNING_DIR/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUN_SIGNING_DIR/distribution.p12" -P "$DEVELOPER_ID_APPLICATION_PSW" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Archive and package
        if: steps.release.outputs.complete != 'true'
        env:
          BUILD: ${{ steps.release.outputs.build }}
          VERSION: ${{ steps.release.outputs.version }}
          ASSET: ${{ steps.release.outputs.asset }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive -project 'Input Source Pro.xcodeproj' -scheme 'Input Source Pro' \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/release-derived-${GITHUB_RUN_ID}" \
            -archivePath dist/ISP.xcarchive CURRENT_PROJECT_VERSION="$BUILD" \
            MARKETING_VERSION="$VERSION" DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application"
          xcodebuild -exportArchive -archivePath dist/ISP.xcarchive \
            -exportOptionsPlist "$RUN_SIGNING_DIR/ExportOptions.plist" -exportPath dist/export
          codesign --verify --deep --strict 'dist/export/Input Source Pro.app'
          python3 scripts/release.py check-bundle
          mkdir -p dist/dmg dist/updates
          npx --yes create-dmg@8.1.0 --overwrite --no-version-in-filename \
            --identity='Developer ID Application' 'dist/export/Input Source Pro.app' dist/dmg
          mv 'dist/dmg/Input Source Pro.dmg' "dist/updates/$ASSET"
      - name: Notarize and staple
        if: steps.release.outputs.complete != 'true'
        env:
          ASSET: ${{ steps.release.outputs.asset }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit --team-id "$TEAM_ID" --apple-id "$APPLE_ID" \
            --password "$NOTARY_PASSWORD" --wait --output-format json "dist/updates/$ASSET" > dist/notarization.json
          python3 -c 'import json; assert json.load(open("dist/notarization.json"))["status"] == "Accepted", "Notarization failed"'
          xcrun stapler staple "dist/updates/$ASSET"
          xcrun stapler validate "dist/updates/$ASSET"
      - name: Publish verified release
        if: steps.release.outputs.complete != 'true'
        run: python3 scripts/release.py publish
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-diagnostics-${{ github.run_id }}
          path: |
            dist/release.json
            dist/notarization.json
      - name: Remove signing credentials
        if: always()
        run: |
          trap 'rm -rf "$RUN_SIGNING_DIR"' EXIT
          if [ -f "$RUN_SIGNING_DIR/keychains.txt" ]; then
            python3 - <<'PY'
          import os, pathlib, shlex, subprocess
          paths = shlex.split((pathlib.Path(os.environ['RUN_SIGNING_DIR']) / 'keychains.txt').read_text())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *paths], check=True)
          PY
          fi
          if [ -f "$RUN_SIGNING_DIR/signing.keychain-db" ]; then
            security delete-keychain "$RUN_SIGNING_DIR/signing.keychain-db"
          fi
          rm -rf "$RUN_SIGNING_DIR"
